name: Build rFactor Plugin

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rfactor_plugin/**'
      - 'installer/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'rfactor_plugin/**'
      - 'installer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Configure CMake
      working-directory: rfactor_plugin
      run: cmake -S . -B build -A x64

    - name: Build C++ plugin DLL (Release)
      working-directory: rfactor_plugin
      run: cmake --build build --config Release --target BrBrDbTelemetry

    - name: Build C++ unit tests (Release)
      working-directory: rfactor_plugin
      run: cmake --build build --config Release --target unit_tests

    - name: Run C++ unit tests via CTest
      working-directory: rfactor_plugin
      run: |
        Copy-Item BrBrTelemetry.test.json -Destination build\bin\Release\BrBrDbTelemetry.json -Force
        ctest --test-dir build -C Release --output-on-failure

    - name: Run C# installer unit tests
      run: dotnet run --project installer/BrBrDbTelemetryInstallerTests.csproj

    - name: Publish C# WinForms installer (Self-Contained .NET 8)
      shell: pwsh
      run: |
        $dll = "rfactor_plugin\build\bin\Release\BrBrDbTelemetry64.dll"
        if (-not (Test-Path $dll)) {
          Write-Error "Plugin DLL not found at $dll"
          exit 1
        }
        dotnet publish installer/BrBrDbTelemetryInstaller.csproj -c Release -o installer/publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item installer\publish\BrBrDbTelemetryInstaller.exe -Destination installer\BrBrDbTelemetryInstaller.exe -Force

    - name: Upload installer EXE
      uses: actions/upload-artifact@v7
      with:
        name: BrBrDbTelemetryInstaller-exe
        path: installer/BrBrDbTelemetryInstaller.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download installer artifact
      uses: actions/download-artifact@v7
      with:
        name: BrBrDbTelemetryInstaller-exe
        path: release-artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: release-artifacts/BrBrDbTelemetryInstaller.exe
        draft: false
        prerelease: false
        generate_release_notes: true
